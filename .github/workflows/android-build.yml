name: Android build reusable
on:
  workflow_call:
    inputs:
      minimum-jvm:
        required: true
        type: number
      retention-days:
        required: true
        type: number
permissions:
  contents: read
jobs:
  build:
    name: Build, lint and JVM
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: ''
      - run: android --no-metrics --sdk="$ANDROID_HOME" sdk install platform-tools platforms/android-37.0 build-tools/36.0.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: ./gradlew :app:assembleDebug :app:lintDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Verify JVM results
        if: always()
        env:
          MINIMUM: ${{ inputs.minimum-jvm }}
        run: python3 .github/scripts/verify_test_results.py app/build/test-results/testDebugUnitTest --minimum "$MINIMUM"
      - name: APK checksum
        id: apk
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
          read -r apk_sha256 apk_filename < SHA256SUMS.txt
          echo "sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $apk_sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: debug-apk-${{ steps.apk.outputs.sha256 }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/debug/output-metadata.json
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
